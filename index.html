<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FOCUS • Andrew</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="matrix"></canvas>
  <canvas id="eye-canvas"></canvas>

  <div class="card-container">
    <div class="card">
      <div class="dots-wrapper">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div class="eyebrow">Do Not Disturb</div>
      <h1>Andrew is working on this computer</h1>
      <p>Deep work session in progress. Screen is locked so nothing gets bumped or closed by mistake.</p>

      <div class="timer" id="timer">25:00</div>

      <div class="terminal-box" id="terminal-logs">
        <span class="term-line">&gt; Initializing background kernel...</span>
      </div>

      <div class="status-box">
        <span id="status-text">Focus session active…</span>
      </div>

      <div class="line"></div>
      <p class="footer">Back when the timer hits zero</p>
    </div>
  </div>

  <script src="lock.js"></script>
</body>
</html>
