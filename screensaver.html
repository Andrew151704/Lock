<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FOCUS • Complete</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="matrix"></canvas>
  <canvas id="eye-canvas"></canvas>

  <div class="card-container">
    <div class="card">
      <div class="dots-wrapper">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div class="eyebrow">Session Complete</div>
      <h1>Great job, Andrew!</h1>
      <p>Your focus session has successfully ended. Take a well-deserved break.</p>

      <div style="margin: 1.5rem 0;">
        <a href="setup.html" style="
          background: var(--accent);
          color: #030405;
          text-decoration: none;
          font-family: inherit;
          font-weight: bold;
          font-size: 0.95rem;
          padding: 0.7rem 1.8rem;
          border-radius: 10px;
          box-shadow: 0 0 15px rgba(0, 255, 156, 0.4);
          text-transform: uppercase;
          letter-spacing: 1px;
          display: inline-block;
        ">Start New Session</a>
      </div>

      <div class="line"></div>
      <p class="footer">Deep work mode deactivated</p>
    </div>
  </div>

  <script src="screensaver.js"></script>
</body>
</html>
