<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Setup • FocusLock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    <div class="card">
      <div class="dots-wrapper">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div class="eyebrow">Configuration</div>
      <h1>Set Focus Duration</h1>
      <p>Choose how long you want to lock the screen for your deep work session.</p>

      <div style="margin: 1.5rem 0;">
        <input type="number" id="minutes-input" min="1" max="120" value="25" style="
          background: rgba(0, 255, 156, 0.05);
          border: 1px solid var(--border);
          color: var(--text);
          font-family: inherit;
          font-size: 1.8rem;
          text-align: center;
          padding: 0.5rem;
          width: 140px;
          border-radius: 10px;
          outline: none;
        ">
        <p style="font-size: 0.8rem; margin-top: 0.5rem; color: var(--muted);">Minutes (1 – 120)</p>
      </div>

      <button id="start-btn" style="
        background: var(--accent);
        color: #030405;
        border: none;
        font-family: inherit;
        font-weight: bold;
        font-size: 1rem;
        padding: 0.8rem 2rem;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(0, 255, 156, 0.4);
        text-transform: uppercase;
        letter-spacing: 1px;
      ">Initialize Lock</button>

      <div class="line"></div>
      <p class="footer">Type 'andrew' anytime to unlock</p>
    </div>
  </div>

  <script src="setup.js"></script>
</body>
</html>
